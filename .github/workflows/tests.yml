name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install numpy pyyaml pytest "opencv-python-headless<5" matplotlib

      # main 에 schema.py 변경이 들어오면 다이어그램을 자동으로 다시 만들어 커밋한다
      - name: Regenerate interface diagram (main)
        if: github.event_name == 'push'
        run: |
          python tools/gen_interfaces.py
          if ! git diff --quiet docs/interfaces.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/interfaces.md
            git commit -m "Regenerate interface diagram from schema.py"
            git push
          fi

      # PR 에서는 다이어그램이 schema.py 와 맞는지만 확인한다
      - name: Check interface diagram (PR)
        if: github.event_name == 'pull_request'
        run: python tools/gen_interfaces.py --check

      - name: Run tests
        run: pytest -q
