# 실행 (설계서 9.3 execution.yaml) — 역할 B
execution:
  default_backend: scripted     # scripted | act — 2일차 04:00 성공률 비교 후 결정
  act: {task_text: "Pick the apple and place it in the box", timeout_s: 30.0}
  soft_landing: {final_descent_m: 0.03, slow_speed_scale: 0.1}
  placement_verify: {height_tol_m: 0.010}   # PLACEHOLDER: 깊이 노이즈 실측 후 교체
  trajectory: {max_joint_step_rad: 0.05, max_cartesian_step_m: null} # [선택] null: 기존 관절 보간; m 값: TCP 중간 목표 추가
  motion:                      # 실기 시간 기준 궤적. 모두 현장 제어·추종 측정 후 입력
    speed_trial_steps: [0.5, 0.6, 0.7, 0.8] # 전체 실기 성공 후 다음 시험 후보만 안내. 자동 변경 없음
    empty_speed_scale: 1.0     # 확인된 빈손 접근·후퇴·scan: 실측 속도/가속도 한도까지. 물체 근처 하강·복구는 기존 속도
    velocity_limits_rad_s: [0.6, 0.6, 0.6, 0.8, 0.8, 1.0] # [제안 10/9 — 역할 B 확인] 약 34~57°/s — 첫 실기는 느리게
    acceleration_limits_rad_s2: [1.0, 1.0, 1.0, 1.5, 1.5, 2.0] # [제안 10/9 — 역할 B 확인]
    command_period_s: 0.05     # [제안 10/9 — 역할 B 확인] 20 Hz — Studio 릴레이가 ~30 Hz 로 안정 전송(10/9 관찰)
    tracking_tolerance_rad: 0.15 # [현장 10/10] 8.6° — Piper 는 펌웨어 속도로 따라가 2.9° 로는 실기 첫 이동부터 멈췄다 (10/9 실측)
    velocity_tolerance_rad_s: 0.6 # [현장 10/10] 10/9 실기에서 0.2 는 정상 이동을 속도 초과로 멈췄다
    capture_joint_tolerance_rad: 0.0087 # [제안 10/9 — 역할 B 확인] 0.5° — 촬영 전후 관절 변화 허용치
  timeouts: {named_pose_s: 90.0, phase_a_s: 90.0, phase_b_s: 60.0, inspect_s: 90.0}  # [현장 10/10] 저속 실기에서 시간 초과로 끊겨 넉넉히
  # [역할 B #48, 10/10 통합] 이송면 경로: 이송 높이로 올라감 → 그 높이에서 목표 위까지 수평 이동 → 목표(집기 전 자세 /
  # 상자 위 hover)로 내려감. 빈손·사과 든 이동 모두. 10/10 실기: 접근 높이(10 cm)로 바로 상자에 가면 든 사과가 이웃 사과
  # 위를 5 cm 차로 지나 경로가 충돌로 거부됐다
  transfer:
    height_m: 0.20             # 이송면 TCP 높이 (base_link, m). 상자 벽 + 사과 지름 + 여유 위여야 한다. null: 기존 경로 (목표로 바로 이동)
    outward_tilt_rad: 0.349    # 이송 중 툴 끝을 베이스 바깥쪽으로 더 기울이는 각 (20°, J5 한계 회피). 시뮬 가상 TCP 0.16 m 기준
    face_place_bearing: true   # 놓을 때 툴 방향을 상자 칸 방위로 돌린다 (10/10 통합: 놓는 자세는 grasp_planner 규칙을 쓰므로 실기 어댑터에서 미사용)
    far_place_radius_m: 0.48   # 이 거리(베이스→칸 중심)보다 먼 칸은 놓을 때 툴 끝을 바깥으로 기울인다 (위와 같음)
    far_place_tilt_rad: 0.1745 # 위 기울기 각 (10°)
  holding_check: warn          # [현장 10/10] stop | warn — 들기 뒤 카메라 확인이 '안 잡음'이면 정지 / 경고만. 실기 오판 2회(실제로는 쥐고 있었음)
  camera_view:                 # 10/9 실기: 손목을 돌린 그리퍼가 탑뷰에서 사과를 가려 들기 확인(holding_verifier)이 실패
    max_occlusion: 0.25        # [임시 10/9] 들어 올린 사과가 팔·그리퍼에 이 비율 넘게 가리면 다른 그리퍼 자세를 먼저 찾는다
    finger_length_m: 0.11      # [임시 10/9 — 역할 D 실측 전] 수제 핑거: TCP(핑거 끝)에서 그리퍼 축을 따라 올라간 길이
  recovery:                    # 미끄러짐 복구 동작 (PR #15 합의: 전부 저속, 공중에서 그리퍼 열기 금지)
    speed_scale: 0.2           # [임시] 복구 이동 속도. safety.speed_scale_max 이하여야 한다
    width_watch: true          # 검사 중 뷰마다 그리퍼 폭 확인 (S8-6 1차 신호). 폭을 읽지 못하는 전송은 건너뜀
    lost_grip_width_m: 0.01    # [임시] 측정 폭이 이 값 이하(완전히 닫힘)면 사과를 놓친 것 → 정지. 역할 D 실측(S8-6)과 맞출 것
  gripper:
    control_mode: fixed_effort
    close_speed: null           # [선택] 코드에서 쓰지 않음
    slip_width_m: 0.002
    opening_margin_m: 0.005    # 초기값: 사과 직경보다 5 mm 여유
    fixed_effort: 1000         # 0.001 N·m 단위: 1000 = 1 N·m. v0.5.12 Studio 저장값과 일치해야 실행
    closing_compression_m: 0.004 # [제안 10/9 — 역할 B 확인] 직경보다 4 mm 안쪽 목표 (힘은 고정 effort 가 정한다). 사과 몇 개로 확인
    contact_settle_s: 0.5      # [제안 10/9 — 역할 B 확인]
    contact_width_tolerance_m: 0.008 # [제안 10/9 — 역할 B 확인] 측정 폭 ↔ 예상 직경 (M1 직경 오차 포함)
    contact_stability_m: 0.001 # [제안 10/9 — 역할 B 확인] 안정 판정 폭 변동
piper_web:
  enabled: false               # 실기 연결은 안전 설정과 follower iface 확인 후 명시적으로 활성화
  base_url: "http://127.0.0.1"   # Piper Web v0.5.9 는 80번 포트 (docs/environment.md)
  iface: "can_follower"          # [제안 10/9 — 역할 B 확인] udev 로 고정한 팔로워 (CAN 어댑터 시리얼 002B…)
  request_timeout_s: 3.0
  goal_timeout_s: 20.0
  poll_interval_s: 0.1
  arrival_tolerance_rad: 0.017453292519943295
  gripper_arrival_tolerance: 2.0
  camera_id: "rs:243122071248:color"  # [제안 10/9 — 역할 B 확인] Studio 카메라 id (10/9 확인)
  robotd_safety_confirmed: false
  joint_limits_deg:
    joint1: [-150, 150]
    joint2: [0, 180]
    joint3: [-170, 0]
    joint4: [-100, 100]
    joint5: [-65, 65]
    joint6: [-120, 120]
  gripper_width_range_m: [0.058, 0.12]  # [실측 10/9] 수제 핑거 안쪽 면 [완전히 닫힘, 최대 벌림] (자) — 58 mm 보다 작은 물체는 못 잡는다
