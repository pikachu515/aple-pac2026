# 실기 카메라 입력 (aple/hal/live_snapshot.py) — 역할 A
# Piper Studio(rsd)가 공유 메모리로 내보내는 D435 컬러·깊이를 읽는다. 카메라 장치를 직접 열지 않는다.
live_camera:
  serial: null                    # [선택] null = 공유 메모리에서 첫 RealSense 자동 선택
  depth_calib: configs/calib/d435.json   # 깊이→컬러 외부 파라미터 (tools/rs_check.py --save-calib)
  near_mm: 150                    # Piper Studio 깊이 인코딩 창 — 카메라 설정 화면 값과 같게 (권장 400/900)
  far_mm: 1200
  frames: 3                       # 스냅샷 1장 = 연속 프레임 깊이 중앙값 (팔 정지 상태에서 잡음·결측 감소)
  max_skew_ms: 50                 # 컬러·깊이 프레임 시각 차 허용
  timeout_s: 2.0
  # 깊이 거리 보정 (aple/hal/depth_correction.py) — 카메라마다 다르다. 실제 거리 = gain / (1/깊이 − offset_per_m)
  # 10/7 D435i 243122071248: 0.74 m 에서 깊이가 45% 짧았다 → gain 1.038, offset_per_m 1.052 (카드 3거리, 오차 1.2% 이내)
  # 10/8 이 카메라는 Tare 로 재보정해 카메라에 저장했다 (tools/rs_calibrate.py, 카드 오차 +0.8~1.7%) → 이 카메라는 1, 0 그대로
  # 현장: 카메라 재보정(On-Chip + Tare) 뒤 tools/depth_check.py 로 회색 카드 거리를 확인하고, 2% 넘게 틀리면 fit 값을 넣는다
  depth_correction:
    gain: 1.0                     # [임시] 1 = 보정 안 함 — tools/depth_check.py 로 확인
    offset_per_m: 0.0             # [임시] 0 = 배율만
  depth_check:
    card_mm: [130, 100]           # [실측 10/08] 회색 카드 긴 변·짧은 변 (자)
    max_error: 0.02               # 카드 거리 상대 오차 허용 — 넘으면 재보정하거나 depth_correction 을 넣는다
