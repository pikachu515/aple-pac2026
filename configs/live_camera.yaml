# 실기 카메라 입력 (aple/hal/live_snapshot.py) — 역할 A
# Piper Studio(rsd)가 공유 메모리로 내보내는 D435 컬러·깊이를 읽는다. 카메라 장치를 직접 열지 않는다.
live_camera:
  serial: null                    # [선택] null = 공유 메모리에서 첫 RealSense 자동 선택
  depth_calib: configs/calib/d435.json   # 깊이→컬러 외부 파라미터 (tools/rs_check.py --save-calib)
  near_mm: 150                    # Piper Studio 깊이 인코딩 창 — 카메라 설정 화면 값과 같게 (권장 400/900)
  far_mm: 1200
  frames: 3                       # 스냅샷 1장 = 연속 프레임 깊이 중앙값 (팔 정지 상태에서 잡음·결측 감소)
  max_skew_ms: 50                 # 컬러·깊이 프레임 시각 차 허용
  timeout_s: 2.0
  max_frame_age_s: 1.0           # 오래된 공유 메모리 프레임 거부. 촬영 요청 이후 노출된 프레임만 사용
