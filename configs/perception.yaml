# 인식 (설계서 9.3 perception.yaml) — 역할 A
perception:
  tracker: {match_radius_m: 0.03}
  sphere_fit: {ransac_threshold_m: 0.003, max_fit_residual_m: null, max_radius_disagreement: 0.5}   # [선택] max_fit_residual_m null = 잔차 검사 안 함
  # max_radius_disagreement [임시]: 10/7 실물 사과 50개는 깊이만으로 맞춘 반지름이 실루엣보다 17~43% 작았다(꼭지 오목·가장자리 깊이 번짐).
  # 0.25(합성 구 기준)면 74~80% 가 신뢰도 절반 → LOW_CONF 리젝트가 됐다. 0.5 는 마스크가 크게 틀린 경우만 거른다
  depth: {min_valid_ratio: 0.4}   # 미달 시 G1, confidence 절반
  max_clearance_m: 0.2            # 이웃·트레이 벽 간격 상한 (주변이 비었을 때)
  top_percentile: 95              # 마스크 내 점 base z 상위 분위 → 사과 꼭대기 높이
  detect:                         # aple/perception/detector.py
    min_height_m: 0.012           # 받침면보다 이만큼 솟은 픽셀만 사과 후보
    diam_range_m: [0.03, 0.12]    # 투영 직경이 이 범위 밖이면 사과가 아니다
    plane: {step_px: 4, iters: 300, tol_m: 0.004}
    close_px: 9                   # 광택 깊이 구멍 메우기
    open_px: 5                    # 잡음 점 지우기
    min_area_px: 50
    split_min_radius_m: 0.02      # 붙은 사과 분리 — 이보다 가까운 봉우리는 한 사과
    min_raised_fraction: 0.3      # YOLO 상자 안 솟은 픽셀 비율 하한 (미달 = 오검출)
    max_height_ratio: 1.6         # [임시] 꼭대기 높이 / 직경 상한 — 넘으면 기둥·팔·상자 벽 (구는 ≈ 1). 10/7 실물 50개(깊이 보정 후) 0.74~1.29 → 1.3 은 여유가 없다
    min_circularity: 0.5          # [임시] 둥근 정도 4πA/P² 하한 — 가늘고 긴 물체 제외 (반으로 가른 사과 ≈ 0.7)
    reject_border: true           # 화면 가장자리에 걸린 덩어리는 잘린 물체라 버린다
  box:                            # aple/perception/box_occupancy.py
    height_percentile: 90
    cell_margin_m: 0.01
    min_valid_ratio: 0.3
    min_points: 15
    occupied_min_height_m: 0.025  # 바닥보다 이만큼 높으면 점유 (최소 사과 반경보다 작게)
    wall_band_m: 0.02
    max_unknown_fraction: 0.5
