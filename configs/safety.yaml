# 안전 (설계서 9.3 safety.yaml) — 역할 B
# 관절 범위·변화율·바닥 충돌·데드맨은 Piper Studio 로봇 데몬이 검사한다. 여기는 우리 쪽 추가 상한.
safety:
  # [현장 10/10] piper_web.joint_limits_deg (Studio robotd 보정 범위) 그대로 — 10/9 에 5° 더 좁힌 값은 상자·종이 위
  #   자세(5축 64°)를 막았다. 이 밖은 robotd 가 잘라 보내므로 더 넓혀도 효과가 없다. j2·j3 의 0 쪽은 접힌 대기
  #   자세(10/9 실측 j2 -2.1°, j3 +0.3~1.7°) 가 들도록 Piper 기구 한계(j2 ≥ -5°, j3 ≤ +5°) 안에서 -4°/+4°
  joint_limits_rad: [[-2.618, 2.618], [-0.0698, 3.1416], [-2.9671, 0.0698], [-1.7453, 1.7453], [-1.1345, 1.1345], [-2.0944, 2.0944]]
  # base_link 기준 TCP(핑거 끝) 목표 상자. 10/9 보정 카메라로 본 테이블 면 z ≈ -0.018 m → z_min = 테이블 + 8 mm (유지).
  #   [현장 10/10] 위·옆은 넉넉히: ACT hold 자세 핑거 끝이 0.55 m 라 z_max 0.45 가 hold → 상자 위 이동과 공중에서의 복귀를
  #   출발점부터 거부했다. 위쪽은 카메라(0.92 m)와 멀다. x·y 도 상자 위 자세(y ±0.29)·hold(x 0.47) 여유
  workspace_aabb_m: [[0.0, 0.70], [-0.50, 0.50], [-0.010, 0.65]]
  speed_scale_max: 0.5
  gripper_effort_max: 1000     # Piper Web v0.5.9 고정 effort 상한
  segment_validation:
    sample_step_rad: 0.02        # [제안 10/9 — 역할 B 확인] 1.1° 간격 관절 샘플 (시뮬 0.01 의 2배 — 계획 시간 절약)
    # [제안 10/9 — 역할 B 확인] 테이블 z -0.018 + 3 mm. ⚠ 충돌 모형은 기본 Piper 그리퍼라 수제 핑거 끝(실측 약 5 cm 더 긺)은
    #   못 막는다 — 핑거 끝 바닥 보호는 robotd floor(모형 최저점 5 cm, 10/9 현장 설정)가 맡는다
    floor_z_m: -0.015
    clearance_m: 0.010           # [제안 10/9 — 역할 B 확인] 카메라–로봇 보정 오차(~5–6 mm)보다 크게
    wall_thickness_m: 0.005      # [제안 10/9 — 역할 B 확인] 골판지 상자 벽 (10/9 현장 상자)
    support_contact_tolerance_m: 0.010 # [제안 10/9 — 역할 B 확인] 리프트 시작 접촉에서만 — 보정 ~6 mm + 깊이 잡음
    obstacle_aabbs_m: []       # [제안 10/9 — 역할 B 확인] 리더 암·노트북은 작업 영역 밖에 둔다는 전제 — 현장에서 확인
    # [제안 10/9 — 역할 B 확인] 핑거 ↔ 어깨(link1)만. 손목(link4~gripper_base) ↔ link1·2 는 접힌 대기 자세에서 14~30 mm 라
    #   넣으면 대기 자세에서 출발하는 경로가 거부된다. 핑거 ↔ link2·link3 은 베이스 가까운 하향 파지(시뮬 x 0.30 m)를
    #   거부해서 뺐다 (clearance 10 mm 기준) — 역할 B 가 여유를 줄여 다시 넣을지 판단
    self_collision_pairs: [[gripper_link1, link1], [gripper_link2, link1]]
    payload_self_links: [link1, link2, link3]   # [제안 10/9 — 역할 B 확인] 운반 사과 ↔ 어깨·상완
