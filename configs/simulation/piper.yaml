# Virtual geometry only. Never merge this overlay into measured workcell files.
simulation:
  model: piper
  initial_joint_rad: [0, 1.67, -1.10, 0, 1.08, 0]
  joint_velocity_rad_s: 1.0
  grasp_tolerance_m: 0.008
  table_z_m: 0.0
  image_size: [480, 640]
  intrinsics: [600, 600, 320, 240]
  apples:
    - {center_m: [0.30, -0.10, 0.032], radius_m: 0.032, red_fraction: 0.1}
    - {center_m: [0.30, 0.0, 0.032], radius_m: 0.032, red_fraction: 0.5}
    - {center_m: [0.30, 0.10, 0.032], radius_m: 0.032, red_fraction: 0.9}
live_camera:
  depth_correction: {gain: 1.0, offset_per_m: 0.0}   # 합성 깊이는 정확하다 — 실물 카메라 보정을 적용하지 않는다
workcell:
  tcp_offset_m: [0, 0, 0.16]
  T_base_camera: [[1, 0, 0, 0.25], [0, -1, 0, 0], [0, 0, -1, 0.65], [0, 0, 0, 1]]
  tray: {center_m: [0.30, 0, 0], size_m: [0.14, 0.32], wall_height_m: 0.02}
  boxes:
    UPPER: {grid: [1, 1], origin_m: [0.155, -0.165, 0], cell_pitch_m: 0.09, wall_height_m: 0.02}
    MIDDLE: {grid: [1, 1], origin_m: [0.155, -0.045, 0], cell_pitch_m: 0.09, wall_height_m: 0.02}
    REJECT: {grid: [1, 1], origin_m: [0.155, 0.075, 0], cell_pitch_m: 0.09, wall_height_m: 0.02}
  poses:
    home_joint_rad: [0, 1.67, -1.10, 0, 1.08, 0]
    scan_joint_rad: [0, 1.67, -1.10, 0, 1.08, 0]
safety:
  joint_limits_rad: [[-2.61799, 2.61799], [0, 3.14159], [-2.96706, 0], [-1.74533, 1.74533], [-1.13446, 1.13446], [-2.09440, 2.09440]]
  workspace_aabb_m: [[0.05, 0.55], [-0.35, 0.35], [0.01, 0.65]]
  segment_validation:
    sample_step_rad: 0.01
    floor_z_m: 0.0
    clearance_m: 0.001
    support_contact_tolerance_m: 0.001 # 가상 깊이/FK 오차만; 실기 설정으로 복사 금지
    obstacle_aabbs_m: []
grasp_planner:
  # Reachable down-facing flange convention for this virtual cell; hardware needs review.
  tool_down_rpy_deg: [0, 180, 0]
  approach_height_m: 0.02
  yaw_step_deg: 180
execution:
  default_backend: scripted
  transfer: {height_m: null}  # 기존 가상 셀은 이송면 경로 없이 (색 분류 시험은 실기 값을 따로 적용)
  motion:
    empty_speed_scale: null # Baseline virtual transport keeps its ordinary speed cap.
inspection:
  policy: NEVER
piper_web:
  enabled: false
orchestration:
  logging: {csv_dir: logs/simulation}

# This virtual cell represents the baseline model, not the unmeasured custom adapters.
gripper_attachment:
  installed: false
