# 크기 구간·파지력 (설계서 9.3 size_bins.yaml) — 역할 D 실측, 역할 B 적용
size_bins:
  gripper_range_mm: [62, 112]   # [실측 10/9] 수제 핑거 58~120 mm — 닫힘 58 + 압축 4 이상, 열림 120 − 개방 여유 5 − 여유 3 이하 (밖이면 UNDERSIZE/OVERSIZE)
  bins:
  - {range_mm: [30, 50],  open_width_mm: null, grasp_height_offset_mm: 0}   # [선택] open_width_mm null = 직경 + 여유로 계산
  # [현장 10/10 05:40] 50 mm 이상 +10 mm: 적도 높이로 내려가면 핑거가 트레이 바닥을 눌러 그리퍼(1 N·m)가 마찰을 못 이기고 안 닫혔다
  - {range_mm: [50, 70],  open_width_mm: null, grasp_height_offset_mm: 10}   # [선택] open_width_mm null = 직경 + 여유로 계산
  - {range_mm: [70, 85],  open_width_mm: null, grasp_height_offset_mm: 10}   # [선택] open_width_mm null = 직경 + 여유로 계산
  - {range_mm: [85, 100], open_width_mm: null, grasp_height_offset_mm: 10}   # [선택] open_width_mm null = 직경 + 여유로 계산
  mass: {density_g_cm3: 0.8}    # AI Hub 직경-무게 회귀 또는 현장 계량으로 교체
  force: {safety_factor: 2.0, a_max_m_s2: 4.9, mu: null, f_bruise_n: null}   # [선택] execution.gripper.control_mode: calibrated_force 일 때만 필요
  gripper_calib: {effort_to_force_table: null}   # [선택] calibrated_force 일 때만. FSR 보정표 [[effort, force_n], ...]
