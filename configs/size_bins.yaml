# 크기 구간·파지력 (설계서 9.3 size_bins.yaml) — 역할 D 실측, 역할 B 적용
size_bins:
  gripper_range_mm: [30, 100]   # 오프셋 핑거 어댑터 장착 기준
  bins:
  - {range_mm: [30, 50],  open_width_mm: null, grasp_height_offset_mm: 0}
  - {range_mm: [50, 70],  open_width_mm: null, grasp_height_offset_mm: 0}
  - {range_mm: [70, 85],  open_width_mm: null, grasp_height_offset_mm: 0}
  - {range_mm: [85, 100], open_width_mm: null, grasp_height_offset_mm: 0}
  mass: {density_g_cm3: 0.8}    # AI Hub 직경-무게 회귀 또는 현장 계량으로 교체
  force: {safety_factor: 2.0, a_max_m_s2: 4.9, mu: null, f_bruise_n: null}
  gripper_calib: {effort_to_force_table: null}   # FSR 보정표 [[effort, force_n], ...]
