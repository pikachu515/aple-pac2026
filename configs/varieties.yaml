# 품종·판정 (설계서 9.3 varieties.yaml) — 역할 C
# standard 는 농산물 표준규격 1011 착색비율 하한. 두 상자를 가르는 기준은 inspection.box_boundary 로 고른다.
# [임시] 표시 값은 사과 표본 실측 전 초기값이다. tools/color_session.py suggest / truth 결과로 교체한다.
varieties:
  fuji:
    standard: {특: 0.60, 상: 0.40, 보통: 0.20}
    delta_up: 0.05                # [임시] '상' 판정 여유 — 리젝트 곡선으로 조정
    delta_mid: 0.0                # [임시]
    hue_range_deg: [-40, 55]      # [임시] 착색 색상각 범위 (0 = 적색, 90 = 황색). suggest 로 확정
    min_chroma: 15                # [임시] 무채색(그림자·반사) 제외
  hongro:
    standard: {특: 0.70, 상: 0.50, 보통: 0.30}
    delta_up: 0.05
    delta_mid: 0.0
    hue_range_deg: [-40, 55]
    min_chroma: 15
inspection:
  default_variety: fuji
  policy: NEVER                   # NEVER(모드 A) | ALWAYS(모드 B) | ADAPTIVE
  box_boundary: 상                # UPPER 상자 최소 등급. 미션이 "특/상" 분류면 특 으로 바꾼다
  judge_camera: top               # 판정은 D435 탑뷰만 (전략 S5-4)
  cos_theta_min: 0.5              # 법선–시선 60° 이내만 판정 (탑뷰 커버리지 ≈ 0.25)
  mask_erode_px: 2                # 마스크 가장자리 배경 섞임 제거
  highlight: {min_L: 90, max_chroma: 12}   # 정반사 하이라이트 제외
  shadow: {max_L: 15, max_fraction: 0.15}   # [임시] L* 15 미만 면적이 15% 넘으면 판정 보류·재촬영 (비율은 고치지 않는다)
  top_view_error: 0.10            # [임시] 판정 구간 반폭 = 치우침을 뺀 뒤 남는 탑뷰 오차. truth 로 확정
  top_view_bias: 0.0              # [임시] 탑뷰 − 전표면 평균 치우침 (+ 면 탑뷰가 높게 봄). 10/7 실측: 꼭지가 위면 평균 +0.12. truth 로 확정
  min_coverage: 0.15
  max_view_disagreement: 0.25     # [임시] 모드 B 뷰 간 편차 한계
  min_confidence: 0.5
  surface_map: {bins: 600, margin: 0.02}   # 모드 B 구면 지도 칸 수, 칸 이산화 여유
  slip_check:                     # 모드 B: 자세로 예측한 사과 중심 vs 깊이로 본 중심 (마할라노비스). T_base_camera 있을 때만
    sigma_lateral_m: 0.0015       # [임시] 깊이 관측의 옆 방향 오차
    sigma_axial_m: 0.003          # [임시] 깊이 방향 오차 (D435 편향 + Piper 8bit 양자화 4mm)
    sigma_pose_m: 0.003           # [임시] 카메라–로봇 보정 + 순기구학 + 파지 측정 오차
    max_mahalanobis: 3.37         # 3자유도 카이제곱 99% (√11.34). 미끄러지지 않은 회전 실측으로 sigma 를 맞춘다
  in_hand_mask:                   # 모드 B 촬영: 손에 든 사과 마스크 (핑거 제외, inspection/in_hand_provider.py)
    search_tol_m: 0.02            # 1차: 예측 구 표면 ± 20mm 안의 깊이 점 (미끄러져도 잡힘)
    surface_tol_m: 0.006          # [임시] 2차: 맞춘 구 표면 뒤 6mm·앞 3mm 만 사과. 링·핑거 앞면이 사과에서 8mm 이상 떨어져야 한다
    roi_margin: 0.5               # 예측 구 투영 반지름 + 50% 범위만 본다
    min_pixels: 200               # 이보다 적으면 같은 자세에서 다시 찍는다
    retries: 1
  views:                          # 모드 B: 툴 수평(약 90°) 후 J6 90° x4 → 커버리지 약 0.9
    center_m: null                 # [선택] base_link 검사 중심. null이면 집어 올린 위치 사용
    tilt_rad: 1.5708
    rotation_angles_rad: [0.0, 1.5708, 3.1416, 4.7124]
    settle_time_s: 0.3
  reuse: {max_displacement_m: 0.005}
