# 작업 셀 (설계서 9.3 workcell.yaml) — 역할 A 측정
# null 은 현장 실측 후 채운다.
workcell:
  expected_apple_count: 5
  frames: {base: base_link, camera: camera_top_optical_frame, tcp: tcp}
  T_base_camera: [[0.103219, 0.967163, -0.232255, 0.615884], [0.994628, -0.102211, 0.016401, -0.036306], [-0.007877, -0.2327, -0.972517, 0.918479], [0, 0, 0, 1]] # [임시] 10/9 20:40 카메라 이동 후 ArUco hand-eye (손목 마커 1개, 12자세 위치 맞춤) 잔차 중앙 4.8 mm·LOO 6.4 mm (data/calib/handeye_1009.json)
  tcp_offset_m: [0.0032, 0.002, 0.1823]    # [임시] 10/9 20:42 피벗 6자세 (회전 152°, 잔차 중앙 ~8 mm — 끝 미끄러짐) data/calib/pivot_1009.json. 자 실측(플랜지 면) 143 mm 와 다름 — link6 원점이 면보다 안쪽
  tray:                         # base_link 축 정렬 사각형
    center_m: null              # [x, y, z] 트레이 바닥 윗면 중심 (m), 현장 실측. null 이면 영상 전체에서 검출
    size_m: [0.3, 0.2]
    wall_height_m: 0.03
  boxes:                        # 등급 번호 = 상자 번호 (UPPER=0, MIDDLE=1, REJECT=2)
    # origin_m: 격자 원점 [x, y, z] (m, base_link) — x·y 최소 칸 모서리, z 상자 바닥 윗면. 현장 실측
    # 격자는 base_link 축 정렬: 열 = +x, 행 = +y, 칸 번호 = 행·cols + 열. null 이면 그 상자는 측정하지 않는다
    UPPER:  {grid: [2, 3], cell_pitch_m: 0.09, wall_height_m: 0.08, origin_m: null}
    MIDDLE: {grid: [2, 3], cell_pitch_m: 0.09, wall_height_m: 0.08, origin_m: null}
    REJECT: {grid: [2, 3], cell_pitch_m: 0.09, wall_height_m: 0.08, origin_m: null}
  # 카메라로 상자·리젝트 종이 구역·사과 집는 영역 찾기 (aple/perception/workcell_detect.py, tools/workcell_detect.py)
  # enabled 면 장면마다 찾아 boxes.*.origin_m·grid·wall_height_m 과 tray(집는 영역)를 채운다. 위 origin_m 은 못 찾을 때 예비값.
  # 10/9 최종 배치: 골판지 상자 — 영상 왼쪽 UPPER(상), 오른쪽 MIDDLE(중) / 가운데 파란 트레이의 로봇 쪽 흰 종이 = REJECT
  # (벽 없음), 아래 파란 부분 = 집는 영역.
  # assign: {이름: 쪽} — 쪽은 left|right|top|bottom (카메라 영상) 또는 +x|-x|+y|-y (base). 대회장이 상·중을 반대로 정하면
  # 이 한 줄만 바꾼다: {UPPER: right, MIDDLE: left}. 그 밖의 키(색 범위·크기·max_yaw_deg 등) 기본값은 코드 _DEFAULTS
  auto_detect: {enabled: true, assign: {UPPER: left, MIDDLE: right}, flat_zone: REJECT}   # [실측 10/9 최종 배치]
  # [현장 10/10] release_above_wall: 칸(9 cm)이 핑거 벌림보다 좁아 벽 높이 위에서 놓는다 → 떨어지는 높이 ≈ 벽 높이(6.5~8 cm)
  placement: {max_drop_m: 0.10, margin_m: 0.01, release_gap_m: 0.01, fill_order: far_to_near, release_above_wall: true}
  poses:                        # 현장에서 텔레오퍼레이션으로 자세를 잡고 tools/teach_pose.py <이름> 으로 저장
    home_joint_rad: [0.0, 0.0, 0.0, 0.0, 0.3971, 0.0] # [제안 10/9 — Studio 파킹 자세(INITIALIZE_POSITION), 접힌 자세라 탑뷰를 가리지 않음 — 역할 B 확인]
    scan_joint_rad: [0.0, 0.0, 0.0, 0.0, 0.3971, 0.0] # [제안 10/9 — Studio 파킹 자세(INITIALIZE_POSITION), 접힌 자세라 탑뷰를 가리지 않음 — 역할 B 확인]
    # 스크립트 + ACT (10/10): ACT ① 이 사과를 들고 멈추는 자세 → 스크립트가 등급 상자 위로 → ACT ② 가 아래 빈 칸에 놓는다
    hold_joint_rad: [-0.06135, 1.44025, -1.91552, -0.00543, 0.5843, -0.11228] # [실측 10/10] ACT ① 끝 = 들고 있는 자세
    hover_UPPER_joint_rad: [-0.66726, 1.54202, -1.42953, 0.03239, 0.6963, -0.2185] # [실측 10/10] 왼쪽 상자(UPPER) 위 — ACT ② 출발 자세
    hover_MIDDLE_joint_rad: [0.51746, 1.46976, -1.42953, 0.34095, 0.7888, -0.42141] # [실측 10/10] 오른쪽 상자(MIDDLE) 위
    hover_REJECT_joint_rad: [-0.10315, 0.69822, -0.72862, 0.08453, 0.92256, -0.09205] # [실측 10/10] 리젝트 종이 위
